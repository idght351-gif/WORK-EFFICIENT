<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기록 관리 · 마일 좌석 도우미</title>
  <link rel="stylesheet" href="ext.css">
</head>
<body>
  <div class="page">
    <h1>기록 관리</h1>
    <p class="muted small" id="state">불러오는 중…</p>

    <section class="card">
      <div class="stats">
        <div class="stat"><b id="n-all">0</b><span>전체 기록</span></div>
        <div class="stat"><b id="n-award">0</b><span>검색 결과로 보이는 데이터</span></div>
        <div class="stat"><b id="n-click">0</b><span>누른 버튼</span></div>
        <div class="stat"><b id="n-page">0</b><span>화면 글자</span></div>
      </div>
      <div id="verdict" class="verdict" hidden></div>
    </section>

    <section class="card">
      <div class="actions">
        <button id="export" class="btn">파일로 저장</button>
        <button id="clear" class="btn secondary">모두 지우기</button>
      </div>
      <p class="msg" id="msg" role="status"></p>
      <p class="muted small" style="margin:8px 0 0">
        파일에는 이름 · 이메일 · 회원번호 · 전화번호 · 로그인 토큰 · 잔여 마일 같은 항목을 가려서 저장해요.
        로그인 · 결제 화면은 처음부터 기록하지 않아요. 그래도 개인 기록이니 <b>GitHub 저장소에는 올리지 말고 Claude 대화에만 첨부</b>해 주세요.
      </p>
    </section>

    <section class="card">
      <b>최근 기록</b> <span class="muted small">(최신 300건)</span>
      <div class="table-wrap" style="margin-top:8px">
        <table>
          <thead><tr><th>시각</th><th>종류</th><th>내용</th><th>크기</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="manage.js" type="module"></script>
</body>
</html>
