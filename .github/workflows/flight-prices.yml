name: 항공권 가격 체크

on:
  schedule:
    # 한국시간 06:30 · 12:30 · 18:30 (UTC 21:30 · 03:30 · 09:30). 기본 브랜치에서만 동작하고,
    # GitHub 사정으로 몇 분~수십 분 늦게 시작될 수 있어요.
    - cron: "30 21 * * *"
    - cron: "30 3 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:        # Actions 탭에서 "Run workflow" 로 바로 실행
  push:
    branches: [main]
    paths:
      - "flight-tracker/routes.json"
      - "flight-tracker/site/**"
      - "flight-tracker/tracker/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flight-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 테스트
        working-directory: flight-tracker/tracker
        run: python -m unittest -q

      - name: 가격 조회 및 알림
        working-directory: flight-tracker/tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # 예약 실행·수동 실행 때만 목표가와 상관없이 최저가 메일을 보냅니다 (코드 push 때는 안 보냄)
          SEND_REPORT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          RUNS_PER_DAY: "3"
        run: python check_prices.py

      - name: 기록 저장 (commit)
        if: always()
        run: |
          git config user.name "flight-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-tracker/site/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "가격 기록 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: flight-tracker/site

  deploy:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
