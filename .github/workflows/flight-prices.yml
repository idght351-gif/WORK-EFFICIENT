name: 항공권 가격 체크

on:
  schedule:
    # 한국시간 06:30 (UTC 21:30) 하루 1번. 기본 브랜치에서만 동작하고,
    # GitHub 사정으로 늦어지거나 빠질 수 있어서 07:10 · 07:50 에 다시 시도합니다.
    # 그날 이미 조회했으면 재시도 실행은 검색 없이 바로 끝나요 (검색 횟수 그대로).
    # 횟수를 늘리려면 cron 줄을 추가하고 아래 RUNS_PER_DAY · SCHEDULE_KST 도 맞춰 주세요 (예: "30 9 * * *" = 18:30).
    - cron: "30 21 * * *"
    - cron: "10 22 * * *"   # 07:10 재시도
    - cron: "50 22 * * *"   # 07:50 재시도
  workflow_dispatch:        # Actions 탭에서 "Run workflow" 로 바로 실행
    inputs:
      route:
        description: "이 노선만 조회 (노선 id, 비우면 전체)"
        required: false
        default: ""
      returns_for:
        description: "앱 요청: 가는 편 하나의 오는 편 목록 (노선id|가는날|편명|출발시각)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "flight-tracker/routes.json"
      - "flight-tracker/site/**"
      - "flight-tracker/tracker/**"
      - "award-tracker/site/**"   # 마일 좌석 추적 앱 (같은 Pages 의 /award/ 에 함께 배포)
      - "award-tracker/marks.json"   # 마일 좌석 앱에서 누른 "좌석 없어짐" 표시 → 아래에서 반영 후 배포

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flight-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # push 때 노선(routes.json)이 바뀌었는지 비교하려고 직전 커밋까지 받음

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 테스트
        working-directory: flight-tracker/tracker
        run: python -m unittest -q

      - name: 가격 조회 및 알림
        working-directory: flight-tracker/tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: sangsoo421@gmail.com   # 알림 받을 주소 (이 주소로만 보냄)
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # 예약 실행·수동 실행 때만 목표가와 상관없이 최저가 메일을 보냅니다 (코드 push 때는 안 보냄)
          SEND_REPORT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          RUN_EVENT: ${{ github.event_name }}
          ONLY_ROUTE: ${{ github.event.inputs.route }}
          RETURNS_FOR: ${{ github.event.inputs.returns_for }}
          RUNS_PER_DAY: "1"
          SCHEDULE_KST: "06:30"   # 위 cron 을 한국시간으로 적은 것 (페이지·메일의 '다음 조회' 표시용)
        # 코드 push 때 노선(routes.json)이 그대로면 검색 없이 페이지 데이터만 다시 만듭니다 (검색 횟수 절약)
        run: |
          if [ -n "$RETURNS_FOR" ]; then
            echo "앱 요청: 오는 편 목록만 조회"
            python check_prices.py
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && ! git diff --name-only HEAD^ HEAD | grep -qx "flight-tracker/routes.json"; then
            echo "노선 변경 없음 → 검색 없이 데이터만 갱신"
            python check_prices.py --dry-run
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "노선 변경 → 바뀐 노선만 조회"
            ONLY_CHANGED=1 python check_prices.py
          else
            python check_prices.py
          fi

      # 마일 좌석 앱에서 사용자가 사이트를 직접 보고 누른 "좌석 없어짐" 표시를 앱 데이터에 반영 (실패해도 가격 기록 · 배포는 계속)
      - name: 마일 좌석 직접 확인 반영
        if: always()
        continue-on-error: true
        run: python award-tracker/tools/award.py apply-marks

      - name: 기록 저장 (commit)
        if: always()
        run: |
          git config user.name "flight-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-tracker/site/data award-tracker/site/data
          if [ -f award-tracker/marks.json ]; then git add award-tracker/marks.json; fi
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "가격 기록 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi

      - name: 배포 버전 표시 (휴대폰에 남은 옛 파일 대신 새 파일을 받게 함)
        if: always()
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" flight-tracker/site/index.html

      # GitHub Pages 는 저장소당 하나라서, 마일 좌석 추적 앱을 /award/ 아래에 함께 올립니다.
      # (버전 표시를 먼저 한 뒤 합쳐야 합친 사이트에도 들어가요)
      - name: 사이트 합치기 (항공권 가격 추적 + 마일 좌석 추적)
        if: always()
        run: |
          rm -rf _site && mkdir -p _site/award
          cp -r flight-tracker/site/. _site/
          cp -r award-tracker/site/. _site/award/

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site

  deploy:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
